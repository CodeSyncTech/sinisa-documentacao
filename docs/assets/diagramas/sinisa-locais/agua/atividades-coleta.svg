<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1535" viewBox="0 0 1240 1535" role="img" aria-labelledby="title desc"><title id="title">Atividades da coleta de Água por perfil</title><desc id="desc">Diagrama de base em quatro raias: administrador prepara acessos, auxiliar preenche e corrige, responsável confere e solicita finalização, sistema valida e grava. A divisão de trabalho é ilustrativa e depende das permissões.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker></defs><rect width="1240" height="1535" fill="#fff"/><text x="620" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#124c75"><tspan x="620" dy="0">SINISA Locais · Água</tspan></text><text x="620" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#172b3a"><tspan x="620" dy="0">Diagrama de atividades de base — preenchimento e finalização pelo prestador</tspan></text><rect x="40" y="110" width="290" height="1290" fill="#f4f0ff" stroke="#cbd5e1"/><rect x="40" y="110" width="290" height="74" fill="#6b46a3"/><text x="185" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="185" dy="0">Administrador de TI</tspan></text><rect x="330" y="110" width="290" height="1290" fill="#eef6ff" stroke="#cbd5e1"/><rect x="330" y="110" width="290" height="74" fill="#22649b"/><text x="475" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="475" dy="0">Responsável pelo</tspan><tspan x="475" dy="22">preenchimento</tspan></text><rect x="620" y="110" width="290" height="1290" fill="#eef9f4" stroke="#cbd5e1"/><rect x="620" y="110" width="290" height="74" fill="#257455"/><text x="765" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="765" dy="0">Auxiliar de</tspan><tspan x="765" dy="22">preenchimento</tspan></text><rect x="910" y="110" width="290" height="1290" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="910" y="110" width="290" height="74" fill="#475569"/><text x="1055" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="1055" dy="0">Sistema</tspan></text><polyline points="185,222 185,247" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="185,313 185,340 475,340 475,360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="475,420 475,445 765,445 765,460" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="765,520 765,540 475,540 475,560" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="475,620 475,635 1055,635 1055,650" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1055,710 1055,736" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="936,790 883,790" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="909" y="777" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155"><tspan x="909" dy="0">Sim</tspan></text><polyline points="647,790 632,790 632,490 647,490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1055,844 1055,860 475,860 475,885" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155"><tspan x="1020" dy="0">Não</tspan></text><polyline points="475,945 475,960 1055,960 1055,975" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1055,1035 1055,1068" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="936,1120 593,1120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="1106" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155"><tspan x="905" dy="0">Não</tspan></text><polyline points="475,1150 475,1197" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1055,1172 1055,1220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1080" y="1204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155"><tspan x="1080" dy="0">Sim</tspan></text><polyline points="1055,1280 1055,1327" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><circle cx="185" cy="210" r="12" fill="#172b3a" stroke="#172b3a" stroke-width="2"/><rect x="66" y="247" width="238" height="66" rx="12" fill="#fff" stroke="#6b46a3" stroke-width="2"/><text x="185" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="185" dy="0">Conferir usuários, perfis</tspan><tspan x="185" dy="22">e vínculos; ajustar</tspan><tspan x="185" dy="22">quando necessário</tspan></text><rect x="357" y="360" width="236" height="60" rx="12" fill="#fff" stroke="#22649b" stroke-width="2"/><text x="475" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="475" dy="0">Acessar Água e a</tspan><tspan x="475" dy="22">participação autorizada</tspan></text><rect x="647" y="460" width="236" height="60" rx="12" fill="#fff" stroke="#257455" stroke-width="2"/><text x="765" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="765" dy="0">Preencher e salvar</tspan><tspan x="765" dy="22">os formulários</tspan></text><rect x="357" y="560" width="236" height="60" rx="12" fill="#fff" stroke="#22649b" stroke-width="2"/><text x="475" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="475" dy="0">Abrir o resumo de</tspan><tspan x="475" dy="22">finalização e conferir</tspan></text><rect x="937" y="650" width="236" height="60" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="1055" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Apurar erros e percentuais</tspan><tspan x="1055" dy="22">mínimos de preenchimento</tspan></text><polygon points="1055,736 1174,790 1055,844 936,790" fill="#fff8dc" stroke="#9b761b" stroke-width="2"/><text x="1055" y="784" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Erros ou mínimo</tspan><tspan x="1055" dy="22">não atendido?</tspan></text><rect x="647" y="760" width="236" height="60" rx="12" fill="#fff" stroke="#257455" stroke-width="2"/><text x="765" y="784" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="765" dy="0">Corrigir / completar</tspan><tspan x="765" dy="22">os dados e salvar</tspan></text><rect x="357" y="885" width="236" height="60" rx="12" fill="#fff" stroke="#22649b" stroke-width="2"/><text x="475" y="909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="475" dy="0">Solicitar e confirmar</tspan><tspan x="475" dy="22">a finalização</tspan></text><rect x="937" y="975" width="236" height="60" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="1055" y="999" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Revalidar perfil, situação,</tspan><tspan x="1055" dy="22">erros e mínimos no servidor</tspan></text><polygon points="1055,1068 1174,1120 1055,1172 936,1120" fill="#fff8dc" stroke="#9b761b" stroke-width="2"/><text x="1055" y="1114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Finalização</tspan><tspan x="1055" dy="22">permitida?</tspan></text><rect x="357" y="1090" width="236" height="60" rx="12" fill="#fff" stroke="#22649b" stroke-width="2"/><text x="475" y="1114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="475" dy="0">Receber bloqueio; verificar</tspan><tspan x="475" dy="22">permissões, situação ou dados</tspan></text><circle cx="475" cy="1210" r="13" fill="#fff" stroke="#172b3a" stroke-width="2"/><circle cx="475" cy="1210" r="8" fill="#172b3a"/><rect x="937" y="1220" width="236" height="60" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><text x="1055" y="1244" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Gravar situação:</tspan><tspan x="1055" dy="22">Finalizado pelo prestador</tspan></text><circle cx="1055" cy="1340" r="13" fill="#fff" stroke="#172b3a" stroke-width="2"/><circle cx="1055" cy="1340" r="8" fill="#172b3a"/><text x="475" y="1249" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#172b3a"><tspan x="475" dy="0">Sem finalização</tspan></text><text x="1055" y="1376" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#172b3a"><tspan x="1055" dy="0">Coleta finalizada</tspan></text><text x="620" y="1432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#172b3a"><tspan x="620" dy="0">Base didática: a divisão de trabalho entre responsável e auxiliar é sugerida; não representa aprovação formal.</tspan></text><text x="620" y="1460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#172b3a"><tspan x="620" dy="0">Administrador: preparação dos acessos conforme permissões. Responsável também pode preencher e corrigir.</tspan></text><text x="620" y="1488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#172b3a"><tspan x="620" dy="0">Pré-condições: usuários autenticados, participação acessível e edição permitida. Falhas de gravação omitidas.</tspan></text><text x="620" y="1516" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#59636e"><tspan x="620" dy="0">Código local consultado em 17/09/2026 · Regras específicas e limites descritos na documentação.</tspan></text></svg>
